[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logicmoo-world-workbench"
version = "0.2.0"
description = "A workbench for learning internal world models from observation and using goals to direct simulation."
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
authors = [{ name = "LogicMOO" }]
keywords = [
  "world-models",
  "goal-reasoning",
  "simulation",
  "neurosymbolic-ai",
  "arc-agi",
  "arc-agi-3",
  "prolog",
  "symbolic-ai",
  "object-memory",
  "rule-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "json-repair>=0.61.6,<0.62",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.24",
  "opencv-contrib-python-headless>=4.9",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
  "psutil>=7.0",
]

[project.optional-dependencies]
debugger = [
  "arc-agi>=0.9.9",
  "openai>=1.0",
  "ansi2html>=1.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=12",
  "pydevd-pycharm",
  "pywinpty>=2.0; platform_system == 'Windows'",
  "ptyprocess>=0.7; platform_system != 'Windows'",
]
notebooks = [
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
]
kaggle = [
  "arc-agi>=0.9.9",
  "kaggle>=2.2",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
]
test = [
  "arc-agi>=0.9.9",
  "pytest>=8.0",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "requests>=2.31",
  "websockets>=12",
]
docs = [
  "pydoc-markdown>=4.8",
]
stt = [
  "sounddevice>=0.5",
  "vosk>=0.3.45",
]
all = [
  "arc-agi>=0.9.9",
  "openai>=1.0",
  "ansi2html>=1.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=12",
  "pydevd-pycharm",
  "pywinpty>=2.0; platform_system == 'Windows'",
  "ptyprocess>=0.7; platform_system != 'Windows'",
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
  "kaggle>=2.2",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "pytest>=8.0",
  "requests>=2.31",
  "sounddevice>=0.5",
  "vosk>=0.3.45",
]

[project.urls]
Homepage = "https://logicmoo.org/"
Repository = "https://github.com/logicmoo/omega_vision"
Issues = "https://github.com/logicmoo/omega_vision/issues"

[tool.setuptools]
packages = [
  "omega_vision",
  "omega_vision.core",
  "omega_vision.demos",
  "omega_vision.forms",
  "omega_vision.accelerators",
  "omega_vision.adapters",
  "omega_vision.evaluation",
  "omega_vision.environments",
  "omega_vision.perception",
  "omega_vision.runtime",
  "omega_vision.services",
  "worldworkbench",
  "worldworkbench.adapters",
]
include-package-data = true

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.package-data]
"omega_vision.perception" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "python",
  "python/workbench_api_server",
  "python/arc_cli_debugger",
  "python/plugins_framework",
]
addopts = "-ra"
